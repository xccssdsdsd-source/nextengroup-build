name: Deploy to Cloudflare (production)

# Każdy push na master buduje aplikację (OpenNext) i wdraża Worker
# getbuild-build przez `wrangler deploy` — tak jak lokalne `npm run deploy`.
#
# WYMAGANE SEKRETY REPO (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token z uprawnieniem "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — ID konta Cloudflare (z panelu Cloudflare)
#
# Build i deploy są osobnymi krokami, żeby w logu było widać, który etap padł.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: cf-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sprawdź sekrety Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Brak sekretu CLOUDFLARE_API_TOKEN w repozytorium. Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        env:
          # Nie pobieraj Chromium dla puppeteer — niepotrzebny przy deployu.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build (OpenNext)
        run: npm run pages:build

      - name: Deploy (Wrangler)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
